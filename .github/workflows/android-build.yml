# Android CI/CD for Chad Phone (chadhao/Phone)
#
# 触发策略:
#   - push / PR 到 main        -> 构建 foss debug APK(快速验证)
#   - 打 tag v* (如 v8.4.0)    -> 构建 foss release APK 并发布 GitHub Release
#   - 手动 workflow_dispatch   -> 构建 foss release APK,上传为 artifact
#
# Release 签名(可选):Settings -> Secrets -> Actions 配齐以下 5 项即自动签名,否则 unsigned:
#   SIGNING_KEYSTORE_BASE64 / SIGNING_STORE_FILE / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD

name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK (licenses + platform 37)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" >/dev/null 2>&1 || true

      - name: Decode signing keystore
        if: env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_STORE_FILE != '' && env.SIGNING_STORE_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_PASSWORD != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$SIGNING_STORE_FILE"
          echo "Keystore decoded to $SIGNING_STORE_FILE"

      # 常规 push / PR:构建 foss debug。
      # shell 为 bash -e,显式 pipefail 防止 gradle 失败被 tee 吞掉(曾致全线假绿)。
      - name: Build debug APK (foss)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        run: |
          set -o pipefail
          ./gradlew assembleFossDebug --no-daemon 2>&1 | tee /tmp/gradle-debug.log

      # tag 或手动触发:构建 foss release(minify + 签名/未签名)
      - name: Build release APK (foss)
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/gradle-release.log

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs artifact
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

      # 打 tag 时发布 GitHub Release(携带 release APK)
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app/build/outputs/apk/foss/release
          ls *.apk *.aab >/dev/null 2>&1 || { echo "::error::No APK/AAB in release output"; exit 1; }
          gh release create "$GITHUB_REF_NAME" *.apk *.aab --generate-notes || \
            gh release create "$GITHUB_REF_NAME" *.apk *.aab

      # 任意步骤失败后的统一上报(末尾,failure 触发):上传 gradle 日志 artifact,并尝试写 commit status
      - name: Publish failure log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-*.log
          if-no-files-found: ignore

      - name: Report failure summary as commit status
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=$(ls /tmp/gradle-*.log 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then
            DESC=$(grep -m1 -A3 -E "FAILURE|What went wrong|Caused by|error:|Exception" "$LOG" | head -6 | tr '\n' ' ' | cut -c1-130)
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=failure -f context="android-build-log" \
              -f description="$DESC" >/dev/null 2>&1 || true
          fi
          exit 0
