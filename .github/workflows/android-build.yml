# Android CI/CD for Chad Phone (chadhao/Phone)
#
# 触发策略:
#   - push / PR 到 main        -> 快速验证(构建 foss debug APK)
#   - 打 tag v* (如 v8.4.0)    -> 构建 foss release APK,并发布到 GitHub Release
#   - 手动 workflow_dispatch   -> 构建 foss release APK,上传为 artifact
#
# Release 签名(可选):在仓库 Settings -> Secrets and variables -> Actions 配置以下 Secret,
# 配置齐全后 release 构建将自动签名;不配置则产出 unsigned APK。
#   SIGNING_KEYSTORE_BASE64  : keystore 文件的 base64 内容(本地可用 `base64 -w0 keystore.jks` 生成)
#   SIGNING_STORE_FILE       : keystore 在 runner 上的相对路径,例如 keystore.jks
#   SIGNING_STORE_PASSWORD   : keystore 密码
#   SIGNING_KEY_ALIAS        : key 别名
#   SIGNING_KEY_PASSWORD     : key 密码

name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    env:
      # --- Release 签名(来自 GitHub Secrets,未配置则为空) ---
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      # checkout/setup-java 升到当前 mainline(v4 已加 Node20 deprecation 警告)。
      # 参数语义未变;setup-java v6 的 Azul API 迁移仅影响 zulu distribution,此处用 temurin。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # 仅当签名 Secret 齐全时解码 keystore,并在步骤级注入 SIGNING_* 供 Gradle 读取
      - name: Decode signing keystore
        if: env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_STORE_FILE != '' && env.SIGNING_STORE_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_PASSWORD != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$SIGNING_STORE_FILE"
          echo "Keystore decoded to $SIGNING_STORE_FILE"

      # 常规 push / PR:只构建 foss debug,快速验证可编译
      # 默认 shell 带 -eo pipefail:gradle 失败时管道整体返回非零,日志已写入 /tmp
      - name: Build debug APK (foss)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleFossDebug --no-daemon 2>&1 | tee /tmp/gradle-debug.log

      # tag 或手动触发:构建 foss release(minify + 签名/未签名)
      - name: Build release APK (foss)
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        run: ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/gradle-release.log

      # AGP 9 产物目录与旧版不同:先 workspace 级搜索 APK/AAB 并拷贝到统一目录再上传。
      # 找不到产物时:打印目录树与全盘搜索结果(含 runner 临时目录),并让 job 失败——禁止空包静默通过。
      - name: Stage APK/AAB for upload
        run: |
          mkdir -p /tmp/apk
          find . -path ./.git -prune -o -type f \( -name '*.apk' -o -name '*.aab' \) -print > /tmp/apk-paths.txt
          echo "--- found in workspace ---"; cat /tmp/apk-paths.txt
          if [ ! -s /tmp/apk-paths.txt ]; then
            {
              echo "no apk/aab under workspace; app/build layout:"
              ls -R app/build 2>/dev/null | head -120
              echo "--- runner-wide search ---"
              find "$RUNNER_TEMP" /home/runner /tmp -type f \( -name '*.apk' -o -name '*.aab' \) 2>/dev/null | head -40
            } > /tmp/stage-diag.txt 2>&1 || true
            cat /tmp/stage-diag.txt
            exit 1
          fi
          while IFS= read -r f; do cp "$f" /tmp/apk/ 2>/dev/null || true; done < /tmp/apk-paths.txt
          echo "--- staged /tmp/apk ---"; ls -la /tmp/apk
          if ! ls /tmp/apk/*.apk /tmp/apk/*.aab >/dev/null 2>&1; then
            echo "::error::APK/AAB paths recorded but copy produced no files in /tmp/apk"
            exit 1
          fi

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            /tmp/apk
            /tmp/apk-paths.txt
          if-no-files-found: warn

      - name: Upload release APKs artifact
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            /tmp/apk
            /tmp/apk-paths.txt
          if-no-files-found: warn

      # 打 tag 时同步发布 GitHub Release(携带 foss release APK,取自 staging 目录)。
      # continue-on-error:Release 创建需要 GITHUB_TOKEN 具备 contents:write 权限
      # (仓库默认权限足够;若设为 read-only,或同名 Release 已存在,此步会失败)。
      # 失败仅留 run 告警、不把已成功的构建标红,便于人工补发。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/apk
          ls *.apk *.aab >/dev/null 2>&1 || { echo "::error::No APK/AAB staged in /tmp/apk"; exit 1; }
          # --generate-notes 由 gh 依据 commit/PR 自动生成;失败时降级为纯文件发布
          gh release create "$GITHUB_REF_NAME" *.apk *.aab --generate-notes || \
            gh release create "$GITHUB_REF_NAME" *.apk *.aab

      # 任意步骤失败后的统一上报(置于末尾,failure 时才触发):上传 Gradle 日志/staging 诊断为 artifact,并尝试写 commit status
      - name: Publish failure diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            /tmp/gradle-*.log
            /tmp/stage-diag.txt
            /tmp/apk-paths.txt
          if-no-files-found: ignore

      - name: Report failure summary as commit status
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DESC=""
          if [ -f /tmp/stage-diag.txt ]; then
            DESC=$(tail -c 600 /tmp/stage-diag.txt | tr '\n' ' ' | tr -s ' ' | cut -c1-130)
          elif LOG=$(ls /tmp/gradle-*.log 2>/dev/null | head -1); then
            DESC=$(grep -m1 -A3 -E "FAILURE|What went wrong|Caused by|error:|Exception" "$LOG" | head -6 | tr '\n' ' ' | cut -c1-130)
          fi
          if [ -n "$DESC" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=failure -f context="android-build-log" \
              -f description="$DESC" >/dev/null 2>&1 || true
          fi
          exit 0
