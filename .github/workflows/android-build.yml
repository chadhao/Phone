# Android CI/CD for AlRight Phone (chadhao/Phone)
#
# 触发策略:
#   - push / PR 到 main        -> 快速验证(构建 gplay debug APK)
#   - 打 tag v* (如 v8.4.0)    -> 构建全部渠道 release APK,并发布到 GitHub Release
#   - 手动 workflow_dispatch   -> 构建全部渠道 release APK,上传为 artifact
#
# Release 签名(可选):在仓库 Settings -> Secrets and variables -> Actions 配置以下 Secret,
# 配置齐全后 release 构建将自动签名;不配置则产出 unsigned APK。
#   SIGNING_KEYSTORE_BASE64  : keystore 文件的 base64 内容(本地可用 `base64 -w0 keystore.jks` 生成)
#   SIGNING_STORE_FILE       : keystore 在 runner 上的相对路径,例如 keystore.jks
#   SIGNING_STORE_PASSWORD   : keystore 密码
#   SIGNING_KEY_ALIAS        : key 别名
#   SIGNING_KEY_PASSWORD     : key 密码
#
# 内购/权益字段(可选,缺省为空字符串,不影响编译):
#   RIGHT_APP_KEY
#   PRODUCT_ID_X1 / PRODUCT_ID_X2 / PRODUCT_ID_X3
#   SUBSCRIPTION_ID_X1 / X2 / X3
#   SUBSCRIPTION_YEAR_ID_X1 / X2 / X3

name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    env:
      # --- Release 签名(来自 GitHub Secrets,未配置则为空) ---
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # --- 内购/权益字段(来自 GitHub Secrets,未配置则为空) ---
      RIGHT_APP_KEY: ${{ secrets.RIGHT_APP_KEY }}
      PRODUCT_ID_X1: ${{ secrets.PRODUCT_ID_X1 }}
      PRODUCT_ID_X2: ${{ secrets.PRODUCT_ID_X2 }}
      PRODUCT_ID_X3: ${{ secrets.PRODUCT_ID_X3 }}
      SUBSCRIPTION_ID_X1: ${{ secrets.SUBSCRIPTION_ID_X1 }}
      SUBSCRIPTION_ID_X2: ${{ secrets.SUBSCRIPTION_ID_X2 }}
      SUBSCRIPTION_ID_X3: ${{ secrets.SUBSCRIPTION_ID_X3 }}
      SUBSCRIPTION_YEAR_ID_X1: ${{ secrets.SUBSCRIPTION_YEAR_ID_X1 }}
      SUBSCRIPTION_YEAR_ID_X2: ${{ secrets.SUBSCRIPTION_YEAR_ID_X2 }}
      SUBSCRIPTION_YEAR_ID_X3: ${{ secrets.SUBSCRIPTION_YEAR_ID_X3 }}

    steps:
      # checkout/setup-java 升到当前 mainline(v4 已加 Node20 deprecation 警告)。
      # 参数语义未变;setup-java v6 的 Azul API 迁移仅影响 zulu distribution,此处用 temurin。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # build.gradle.kts 会无条件读取 local.properties;缺失则配置阶段直接失败。
      # CI 上 AGP 通过 ANDROID_HOME 定位 SDK,这里只需补齐内购字段(缺省为空)。
      - name: Generate local.properties
        run: |
          {
            echo "RIGHT_APP_KEY=${RIGHT_APP_KEY}"
            echo "PRODUCT_ID_X1=${PRODUCT_ID_X1}"
            echo "PRODUCT_ID_X2=${PRODUCT_ID_X2}"
            echo "PRODUCT_ID_X3=${PRODUCT_ID_X3}"
            echo "SUBSCRIPTION_ID_X1=${SUBSCRIPTION_ID_X1}"
            echo "SUBSCRIPTION_ID_X2=${SUBSCRIPTION_ID_X2}"
            echo "SUBSCRIPTION_ID_X3=${SUBSCRIPTION_ID_X3}"
            echo "SUBSCRIPTION_YEAR_ID_X1=${SUBSCRIPTION_YEAR_ID_X1}"
            echo "SUBSCRIPTION_YEAR_ID_X2=${SUBSCRIPTION_YEAR_ID_X2}"
            echo "SUBSCRIPTION_YEAR_ID_X3=${SUBSCRIPTION_YEAR_ID_X3}"
          } > local.properties
          echo "local.properties generated ($(wc -l < local.properties) lines)"

      # 仅当签名 Secret 齐全时解码 keystore,并在步骤级注入 SIGNING_* 供 Gradle 读取
      - name: Decode signing keystore
        if: env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_STORE_FILE != '' && env.SIGNING_STORE_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_PASSWORD != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$SIGNING_STORE_FILE"
          echo "Keystore decoded to $SIGNING_STORE_FILE"

      # 常规 push / PR:只构建 gplay debug,快速验证可编译
      # 默认 shell 带 -eo pipefail:gradle 失败时管道整体返回非零,日志已写入 /tmp
      - name: Build debug APK (gplay)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleGplayDebug --no-daemon 2>&1 | tee /tmp/gradle-debug.log

      # tag 或手动触发:构建全部 4 个渠道 release(minify + 签名/未签名)
      - name: Build release APKs (all flavors)
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        run: ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/gradle-release.log

      # 构建失败时:上传 Gradle 日志为 artifact,并把错误摘要写入 commit status(匿名可读,便于无 token 排查)
      - name: Publish failure log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-*.log
          if-no-files-found: ignore

      - name: Report failure summary as commit status
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=$(ls /tmp/gradle-*.log 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then
            DESC=$(grep -m1 -A3 -E "FAILURE|What went wrong|Caused by|error:|Exception" "$LOG" | head -6 | tr '\n' ' ' | cut -c1-130)
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=failure -f context="android-build-log" \
              -f description="$DESC" >/dev/null 2>&1 || true
          fi
          exit 0

      # AGP 9 产物目录与旧版不同:全局搜索 APK/AAB 并拷贝到统一目录,再上传。
      # 三种触发(debug push / tag / dispatch)都运行此 staging;产物互斥,视触发而定。
      - name: Stage APK/AAB for upload
        run: |
          mkdir -p /tmp/apk
          find . -path ./.git -prune -o -type f \( -name '*.apk' -o -name '*.aab' \) -print > /tmp/apk-paths.txt
          echo "--- found APK/AAB ---"; cat /tmp/apk-paths.txt
          echo "--- app/build layout ---"; ls -R app/build 2>/dev/null | head -40 || true
          while IFS= read -r f; do cp "$f" /tmp/apk/ 2>/dev/null || true; done < /tmp/apk-paths.txt
          ls -la /tmp/apk || true

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            /tmp/apk
            /tmp/apk-paths.txt
          if-no-files-found: warn

      - name: Upload release APKs artifact
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            /tmp/apk
            /tmp/apk-paths.txt
          if-no-files-found: warn

      # 打 tag 时同步发布 GitHub Release(携带全部渠道 release APK,取自 staging 目录)。
      # continue-on-error:Release 创建需要 GITHUB_TOKEN 具备 contents:write 权限
      # (仓库默认权限足够;若设为 read-only,或同名 Release 已存在,此步会失败)。
      # 失败仅留 run 告警、不把已成功的构建标红,便于人工补发。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/apk
          ls *.apk *.aab >/dev/null 2>&1 || { echo "::error::No APK/AAB staged in /tmp/apk"; exit 1; }
          # --generate-notes 由 gh 依据 commit/PR 自动生成;失败时降级为纯文件发布
          gh release create "$GITHUB_REF_NAME" *.apk *.aab --generate-notes || \
            gh release create "$GITHUB_REF_NAME" *.apk *.aab
